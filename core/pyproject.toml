[project]
name = "toolkit-core"
version = "2.0.0"
description = "Vault resolution, profile resolution, and the unisphere CLI (`toolkit` is its alias; contract/ implementation)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
unisphere = "toolkit_core.cli:main"
toolkit = "toolkit_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit_core"]
