[project]
name = "agentic-toolkit-workspace"
version = "2.0.0"
description = "Workspace root — see core/ for the toolkit package."
requires-python = ">=3.11"
# Root depends on toolkit-core so a cold `uv run toolkit ...` works without
# an explicit --all-packages sync [earned: cold-boot test 2026-07-26 — README
# quick start failed on a fresh clone with "Failed to spawn: toolkit"].
dependencies = ["toolkit-core"]

[tool.uv.sources]
toolkit-core = { workspace = true }

[tool.uv.workspace]
members = ["core"]

[dependency-groups]
dev = ["ruff>=0.16.0", "pytest>=9.1.1"]

# Pinned ruleset so local and CI lint agree regardless of user-level ruff config.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Self-contained plugin scripts do sys.path setup before imports (no installed package).
"plugins/*/scripts/**" = ["E402"]
"plugins/*/evals/**" = ["E402"]
