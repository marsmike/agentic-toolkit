[package]
name = "farsight"
version = "0.1.1"
edition = "2021"
description = "Stateless BM25 search over an agentic-toolkit vault's active-content notes."
license = "MIT"
repository = "https://github.com/marsmike/agentic-toolkit"

[[bin]]
name = "farsight"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
