[package]
name = "gaiafield"
version = "0.1.0"
edition = "2021"
description = "Deterministic knowledge-graph extraction over an agentic-toolkit vault's wikilinks."
license = "MIT"
repository = "https://github.com/marsmike/agentic-toolkit"

[[bin]]
name = "gaiafield"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
