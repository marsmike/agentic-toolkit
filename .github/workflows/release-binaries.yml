# farsight (R1) is the first real crate this workflow builds — see crates/farsight.
# Kept minimal on purpose: a skeleton to extend as more crates ship.
# Removal condition: replace with cargo-dist if crate count exceeds 2.
name: Release Binaries

on:
  push:
    tags:
      - '*-v*' # e.g. farsight-v0.1.0 -> crate "farsight", version "0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive crate name from tag
        id: crate
        shell: bash
        run: |
          name="${GITHUB_REF_NAME%-v*}"
          if [[ ! "$name" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Invalid crate name in release tag"
            exit 1
          fi
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # x86_64 musl is native to the ubuntu-latest runner — musl-tools alone is enough.
      - name: Install musl tools (native x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # aarch64 musl is a real cross-compile from an x86_64 runner: apt's musl-tools
      # only ships an x86_64 musl-gcc, so linking needs an aarch64 musl cross toolchain.
      # farsight itself has no C dependencies (confirmed via `cargo tree`: serde_yaml's
      # unsafe-libyaml is pure Rust), so this step only needs to provide a linker, not a
      # C compiler for vendored sources — this is the step the crate now proves out.
      - name: Set up aarch64-musl cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" -p "$CRATE_NAME"

      - name: Package binary
        shell: bash
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
          TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          bin="$CRATE_NAME"
          target="$TARGET"
          mkdir -p dist
          if [[ "$TARGET_OS" == windows-latest ]]; then
            cp "target/${target}/release/${bin}.exe" "dist/${bin}-${target}.exe"
          else
            cp "target/${target}/release/${bin}" "dist/${bin}-${target}"
          fi

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
