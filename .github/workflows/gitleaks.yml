name: gitleaks

# push-only: every in-repo branch (incl. dependabot) is scanned on push, and the
# pull_request trigger failed on dependabot's read-only token ("Resource not
# accessible by integration") [earned: run 30203439089, 2026-07-26]. Removal
# condition: re-add pull_request with explicit permissions if external-fork PRs
# ever need pre-merge scanning.
on:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history scan, not just the diff
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
