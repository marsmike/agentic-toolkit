[project]
name = "readwise-plugin-scripts"
version = "2.4.0"
description = "Standalone scripts for the readwise plugin — no vendored env, run via `uv run`."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  # PDF-to-Markdown conversion (pdf_extract.py). Rust core via PyO3, Apache-2.0, local, no
  # LLM, no GPU; prebuilt wheels for macOS arm64 and Linux x86_64/aarch64 at ~12-14MB each, so
  # a fresh `uv run` install in the cloud pipeline's container stays cheap. See
  # plugins/readwise/README.md's Library note for the licence comparison that picked it.
  "liteparse>=2.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
