<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent) || {notes: [], runs: [], inbox: 0, vault: "TheVoid"};
  const TYPES = ["tweet", "article", "video", "paper", "repo", "podcast", "own"];
  const TYPE_LABEL = {tweet: "Tweet", article: "Article", video: "Video", paper: "Paper", repo: "Repo", podcast: "Podcast", own: "Own / other"};
  const RANGES = [["today", "Today"], ["yesterday", "Yesterday"], ["7", "7 days"], ["30", "30 days"], ["all", "12 weeks"]];
  const PAGE = 120;

  // ---- dates are the viewer's local days, not the build's -----------------------------------
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
  const TODAY = iso(new Date());
  const fmtDay = s => new Date(s + "T12:00:00").toLocaleDateString(undefined, {weekday: "short", day: "numeric", month: "short"});
  const dayName = s => s === TODAY ? "Today" : s === addDays(TODAY, -1) ? "Yesterday" : fmtDay(s);

  // ---- state ----------------------------------------------------------------------------------
  const store = {get: k => { try { return localStorage.getItem("void-dash:" + k); } catch { return null; } },
                 set: (k, v) => { try { localStorage.setItem("void-dash:" + k, v); } catch { /* private mode */ } }};
  const S = {range: store.get("range") || "7", domain: null, kind: null, type: null, q: "", shown: PAGE};

  function span(range) {
    if (range === "today") return [TODAY, TODAY];
    if (range === "yesterday") { const y = addDays(TODAY, -1); return [y, y]; }
    if (range.startsWith("day:")) { const d = range.slice(4); return [d, d]; }
    if (range === "all") return [addDays(TODAY, -(DATA.window || 84) + 1), TODAY];
    return [addDays(TODAY, -Number(range) + 1), TODAY];
  }
  const inSpan = (n, [a, b]) => n.day >= a && n.day <= b;
  function matches(n, skip) {
    if (skip !== "domain" && S.domain && !n.domains.includes(S.domain)) return false;
    if (skip !== "kind" && S.kind && n.kind !== S.kind) return false;
    if (skip !== "type" && S.type && n.type !== S.type) return false;
    if (S.q) {
      const hay = (n.title + " " + n.desc + " " + n.author + " " + n.domains.join(" ")).toLowerCase();
      if (!S.q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }

  // ---- tiny DOM helpers: data only ever goes in as text ----------------------------------------
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
      else if (k === "style") e.setAttribute("style", v); else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null) e.append(kid);
    return e;
  }
  const SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; }
  const color = t => `var(--s-${t})`;
  const obsidian = p => `obsidian://open?vault=${encodeURIComponent(DATA.vault)}&file=${encodeURIComponent(p.replace(/\.md$/, ""))}`;
  const safeUrl = u => /^https?:\/\//i.test(u) ? u : null;
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

  const tip = document.getElementById("tip");
  function showTip(ev, build) {
    tip.replaceChildren(...build()); tip.style.opacity = 1;
    const r = tip.getBoundingClientRect(); let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  const hideTip = () => { tip.style.opacity = 0; };

  function set(k, v) { S[k] = S[k] === v ? null : v; S.shown = PAGE; render(); }
  function setRange(r) { S.range = r; if (!r.startsWith("day:")) store.set("range", r); S.shown = PAGE; render(); }

  // ---- sections -------------------------------------------------------------------------------
  function renderRanges() {
    const box = document.getElementById("ranges");
    box.replaceChildren(...RANGES.map(([k, label]) => el("button", {"aria-pressed": String(S.range === k), onclick: () => setRange(k), text: label})));
    if (S.range.startsWith("day:")) box.append(el("button", {"aria-pressed": "true", text: fmtDay(S.range.slice(4))}));
  }

  function renderChips() {
    const chips = [];
    if (S.domain) chips.push(["Domain", S.domain, () => set("domain", S.domain)]);
    if (S.kind) chips.push(["Kind", S.kind, () => set("kind", S.kind)]);
    if (S.type) chips.push(["Source", TYPE_LABEL[S.type], () => set("type", S.type)]);
    if (S.q) chips.push(["Search", S.q, () => { S.q = ""; document.getElementById("q").value = ""; render(); }]);
    document.getElementById("chips").replaceChildren(...chips.map(([k, v, off]) =>
      el("button", {class: "chip", onclick: off, "aria-label": `Remove filter ${k}: ${v}`}, `${k}: ${v}`, el("span", {class: "x", text: "×"}))));
  }

  function renderKpis(list, sp) {
    const len = Math.round((new Date(sp[1]) - new Date(sp[0])) / 864e5) + 1;
    const prevSpan = [addDays(sp[0], -len), addDays(sp[0], -1)];
    const prev = DATA.notes.filter(n => inSpan(n, prevSpan) && matches(n)).length;
    const d = list.length - prev;
    const tweets = list.filter(n => n.type === "tweet").length;
    const domains = new Set(list.flatMap(n => n.domains)).size;
    const tiles = [
      [list.length, "notes distilled", prev || list.length ? `${d >= 0 ? "▲" : "▼"} ${Math.abs(d)} vs previous ${len === 1 ? "day" : len + " days"}` : ""],
      [list.length ? Math.round(100 * tweets / list.length) + "%" : "–", `from tweets (${tweets})`, ""],
      [domains, "domains touched", ""],
      [DATA.inbox, "captures waiting in the inbox", "at build time"],
    ];
    document.getElementById("kpis").replaceChildren(...tiles.map(([v, l, extra]) =>
      el("div", {class: "card kpi"}, el("div", {class: "v"}, String(v), extra && l !== "captures waiting in the inbox" ? el("span", {class: "delta", text: extra}) : null),
        el("div", {class: "l", text: l + (extra && l === "captures waiting in the inbox" ? ` · ${extra}` : "")}))));
  }

  function renderActivity(sp) {
    const days = Array.from({length: 30}, (_, i) => addDays(TODAY, i - 29));
    const pool = DATA.notes.filter(n => matches(n));
    const by = Object.fromEntries(days.map(d => [d, Object.fromEntries(TYPES.map(t => [t, 0]))]));
    for (const n of pool) if (by[n.day]) by[n.day][n.type]++;
    const tot = d => TYPES.reduce((s, t) => s + by[d][t], 0);
    const max = Math.max(4, ...days.map(tot));
    const step = max <= 8 ? 2 : max <= 20 ? 5 : max <= 50 ? 10 : 20;
    const top = Math.ceil(max / step) * step;
    const W = 720, H = 200, L = 26, B = 22, T = 8, bw = (W - L) / days.length;
    const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Notes distilled per day, last 30 days, stacked by source"});
    const g = sv("g", {class: "axis"}); svg.append(g);
    for (let v = 0; v <= top; v += step) {
      const y = T + (H - B - T) * (1 - v / top);
      g.append(sv("line", {x1: L, x2: W, y1: y, y2: y, "stroke-dasharray": v ? "2 4" : ""}));
      const t = sv("text", {x: L - 6, y: y + 3.5, "text-anchor": "end"}); t.textContent = v; g.append(t);
    }
    days.forEach((d, i) => {
      const x = L + i * bw, inside = d >= sp[0] && d <= sp[1];
      const col = sv("g", {opacity: inside ? 1 : .32, style: "cursor:pointer"});
      let y = H - B;
      const stack = TYPES.filter(t => by[d][t]);
      stack.forEach((t, j) => {
        const h = (H - B - T) * by[d][t] / top, last = j === stack.length - 1;
        y -= h;
        const gap = j ? 2 : 0;
        const r = sv("rect", {x: x + bw * .18, y: y, width: bw * .64, height: Math.max(0, h - gap), fill: color(t), rx: last ? 3 : 0});
        col.append(r);
      });
      col.append(sv("rect", {x, y: T, width: bw, height: H - B - T, fill: "transparent"}));
      if (i % 5 === 4 || i === 29) { const t = sv("text", {x: x + bw / 2, y: H - 6, "text-anchor": "middle"}); t.textContent = d === TODAY ? "today" : d.slice(8) + "." + d.slice(5, 7); svg.append(t); }
      col.addEventListener("mousemove", ev => showTip(ev, () => [el("b", {text: dayName(d) + " · " + tot(d) + " notes"}),
        ...TYPES.filter(t => by[d][t]).map(t => el("div", {class: "r"}, el("span", {class: "sw", style: `background:${color(t)}`}), `${TYPE_LABEL[t]} ${by[d][t]}`))]));
      col.addEventListener("mouseleave", hideTip);
      col.addEventListener("click", () => setRange("day:" + d));
      svg.append(col);
    });
    document.getElementById("activity").replaceChildren(svg);
    const counts = Object.fromEntries(TYPES.map(t => [t, DATA.notes.filter(n => inSpan(n, sp) && matches(n, "type") && n.type === t).length]));
    document.getElementById("legend").replaceChildren(...TYPES.filter(t => counts[t] || S.type === t).map(t =>
      el("button", {class: "lg", "aria-pressed": String(S.type === t), "data-dim": String(!!S.type && S.type !== t), onclick: () => set("type", t)},
        el("span", {class: "sw", style: `background:${color(t)}`}), `${TYPE_LABEL[t]} ${counts[t]}`)));
  }

  function renderHeat(sp) {
    const weeks = 12, pool = DATA.notes.filter(n => matches(n));
    const count = {}; for (const n of pool) count[n.day] = (count[n.day] || 0) + 1;
    const now = new Date(TODAY + "T12:00:00"), dow = (now.getDay() + 6) % 7;  // Monday first
    const start = addDays(TODAY, -(weeks * 7 - 1) + (6 - dow));
    const max = Math.max(1, ...Object.values(count));
    const level = c => !c ? 0 : Math.min(5, 1 + Math.floor(4 * (c - 1) / Math.max(1, max - 1)));
    const cells = [];
    for (let i = 0; i < weeks * 7; i++) {
      const d = addDays(start, i), c = count[d] || 0;
      cells.push(el("button", {class: "d" + (d > TODAY ? " future" : ""), style: `background:var(--seq-${level(c)})`,
        "data-in": String(d >= sp[0] && d <= sp[1] && sp[0] === sp[1]), "aria-label": `${fmtDay(d)}: ${c} notes`,
        onclick: () => setRange("day:" + d),
        onmousemove: ev => showTip(ev, () => [el("b", {text: dayName(d)}), el("div", {text: `${c} note${c === 1 ? "" : "s"}`})]),
        onmouseleave: hideTip}));
    }
    document.getElementById("heat").replaceChildren(el("div", {class: "heat"}, cells));
    document.getElementById("heatlegend").replaceChildren(el("span", {class: "lg", style: "cursor:default"}, "less",
      ...[0, 1, 2, 3, 4, 5].map(l => el("span", {class: "sw", style: `background:var(--seq-${l})`})), "more"));
  }

  function renderBars(id, hintId, list, key, field, limit) {
    const counts = new Map();
    for (const n of list) for (const v of [].concat(n[field])) counts.set(v, (counts.get(v) || 0) + 1);
    const rows = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, limit);
    if (S[key] && !counts.has(S[key])) rows.push([S[key], 0]);
    const max = Math.max(1, ...rows.map(r => r[1]));
    document.getElementById(hintId).textContent = counts.size > limit ? `top ${limit} of ${counts.size} · click to filter` : "click to filter";
    document.getElementById(id).replaceChildren(...(rows.length ? rows.map(([name, c]) =>
      el("button", {class: "brow", "aria-pressed": String(S[key] === name), onclick: () => set(key, name), "aria-label": `${name}: ${c}`},
        el("span", {class: "n", text: name}), el("span", {class: "t"}, el("span", {class: "f", style: `width:${Math.max(2, 100 * c / max)}%`})),
        el("span", {class: "c", text: String(c)}))) : [el("div", {class: "empty", text: "Nothing in this range."})]));
  }

  function renderFeed(list) {
    const feed = document.getElementById("feed");
    if (!list.length) { feed.replaceChildren(el("div", {class: "empty", text: "No notes match. Try a wider range or clear a filter."})); return; }
    const shown = list.slice(0, S.shown), groups = new Map();
    for (const n of shown) { if (!groups.has(n.day)) groups.set(n.day, []); groups.get(n.day).push(n); }
    const all = new Map(); for (const n of list) all.set(n.day, (all.get(n.day) || 0) + 1);
    const out = [];
    for (const [day, notes] of groups) {
      out.push(el("div", {class: "feed-day"}, el("h3", {text: dayName(day)}), el("span", {text: `${day === TODAY || day === addDays(TODAY, -1) ? fmtDay(day) + " · " : ""}${all.get(day)} note${all.get(day) === 1 ? "" : "s"}`})));
      out.push(el("div", {class: "notes"}, notes.map(card)));
    }
    if (list.length > S.shown) out.push(el("button", {class: "more", onclick: () => { S.shown += PAGE; render(); }, text: `Show more (${list.length - S.shown} left)`}));
    feed.replaceChildren(...out);
  }

  function card(n) {
    const src = safeUrl(n.source);
    return el("article", {class: "note", style: `--c:${color(n.type)}`},
      el("div", {class: "meta"},
        el("span", {class: "type"}, el("span", {class: "sw", style: `background:${color(n.type)}`}), TYPE_LABEL[n.type]),
        n.author ? el("span", {class: "who", text: n.author, title: n.author}) : null,
        src ? el("a", {class: "src", href: src, target: "_blank", rel: "noopener noreferrer", text: host(src), title: src}) : null),
      el("a", {class: "title", href: obsidian(n.path), text: n.title.replace(/(?<!\d)-|-(?!\d)/g, " "), title: n.path}),
      n.desc ? el("p", {text: n.desc}) : null,
      el("div", {class: "tags"},
        el("button", {class: "tag kind", text: n.kind, onclick: () => set("kind", n.kind)}),
        n.domains.map(d => el("button", {class: "tag", text: d, onclick: () => set("domain", d)}))));
  }

  function renderRuns() {
    const runs = (DATA.runs || []).slice(0, 16);
    document.getElementById("runhint").textContent = runs.length ? `${DATA.runs.length} in 12 weeks · latest ${runs.length}` : "";
    document.getElementById("runs").replaceChildren(...(runs.length ? runs.map(r => {
      const at = new Date(r.at);
      const when = isNaN(at) ? r.at : at.toLocaleString(undefined, {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
      return el("div", {class: "run"},
        el("span", {class: "when", text: when}),
        el("span", {class: "mini", title: `${r.distilled} distilled`}, Array.from({length: Math.min(r.distilled, 14)}, () => el("i")),
          el("span", {style: "margin-left:6px;font-variant-numeric:tabular-nums", text: String(r.distilled)})),
        el("span", {class: "sum"}, r.failed ? el("span", {class: "bad", text: `⚠ ${r.failed} failed · `}) : null, r.summary));
    }) : [el("div", {class: "empty", text: "No pipeline runs in the window."})]));
  }

  function render() {
    const sp = span(S.range);
    const list = DATA.notes.filter(n => inSpan(n, sp) && matches(n));
    renderRanges(); renderChips(); renderKpis(list, sp); renderActivity(sp); renderHeat(sp);
    renderBars("domains", "domhint", DATA.notes.filter(n => inSpan(n, sp) && matches(n, "domain")), "domain", "domains", 10);
    renderBars("kinds", "kindhint", DATA.notes.filter(n => inSpan(n, sp) && matches(n, "kind")), "kind", "kind", 8);
    renderFeed(list); renderRuns();
  }

  // ---- chrome ----------------------------------------------------------------------------------
  const built = new Date(DATA.built);
  document.getElementById("sub").textContent = `${DATA.notes.length} notes in ${DATA.window || 84} days · built ${isNaN(built) ? DATA.built : built.toLocaleString(undefined, {weekday: "short", hour: "2-digit", minute: "2-digit"})} by the pipeline`;
  document.getElementById("foot").textContent = `Generated by dashboard_build.py from ${DATA.vault}. Titles open in Obsidian; the source link opens the original.`;
  let t; document.getElementById("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); S.shown = PAGE; render(); }, 120); });
  function applyTheme(v) {
    if (v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v);
    document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === v)));
    store.set("theme", v);
  }
  document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => applyTheme(b.dataset.themeSet)));
  applyTheme(store.get("theme") || "auto");
  render();
})();
</script>
</body>
</html>
